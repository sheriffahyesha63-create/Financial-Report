<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICF-SL · Financial Login</title>
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f7fc;  /* plain light background */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    /* ----- main card (plain body) ----- */
    .login-card {
      background: #ffffff;
      border-radius: 40px;
      padding: 2.5rem 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 50px -12px rgba(0, 20, 40, 0.25);
      border: 1px solid rgba(0, 20, 40, 0.04);
      transition: transform 0.2s ease;
      margin: 1.5rem 0;
    }

    .login-card:hover {
      transform: scale(1.003);
    }

    /* ----- DARK BLUE HEADER ----- */
    .header-dark {
      background: #0a1e33;        /* deep dark blue */
      width: 100%;
      max-width: 820px;
      border-radius: 60px 60px 30px 30px;
      padding: 1.2rem 2.2rem 1rem 2.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      box-shadow: 0 8px 24px rgba(10, 30, 51, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    /* ICF logo placeholder (PNG) */
    .logo-placeholder {
      width: 48px;
      height: 48px;
      background: #1d3b5a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: #b6d6ff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      flex-shrink: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="%231d3b5a" stroke="%234a7db0" stroke-width="2"/><text x="50" y="64" font-size="32" text-anchor="middle" fill="%23b6d6ff" font-family="Inter, sans-serif" font-weight="700">ICF</text></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    /* if actual ICF logo.png is available, use this: 
       .logo-placeholder { background: url('ICF logo.png') center/contain no-repeat; background-size: 80%; }
    */

    .header-title-group {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .header-main-title {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.3px;
      color: #f0f7ff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .header-sub-title {
      font-weight: 400;
      font-size: 0.85rem;
      color: #8eb9e6;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .header-sub-title i {
      font-size: 0.7rem;
      color: #6d9fd1;
    }

    /* right side (optional small badge) */
    .header-badge {
      background: rgba(255,255,255,0.06);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.04);
      color: #aac9f0;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* ----- DARK BLUE FOOTER ----- */
    .footer-dark {
      background: #0a1e33;
      width: 100%;
      max-width: 820px;
      border-radius: 30px 30px 60px 60px;
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      box-shadow: 0 -4px 20px rgba(10, 30, 51, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.04);
      margin-top: 0.2rem;
    }

    .footer-text {
      color: #a8c7ed;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .footer-text i {
      color: #5e8fc7;
      font-size: 0.9rem;
    }

    .footer-divider {
      width: 4px;
      height: 4px;
      background: #31638f;
      border-radius: 50%;
      display: inline-block;
      opacity: 0.4;
    }

    /* ----- login card inner (plain white) ----- */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.1rem;
    }

    .brand i {
      font-size: 1.8rem;
      color: #1f4b77;
    }

    .brand h1 {
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      color: #0c2947;
    }

    .subhead {
      color: #2b4d72;
      font-size: 0.95rem;
      font-weight: 400;
      margin-bottom: 2rem;
      border-left: 3px solid #3a7bb0;
      padding-left: 0.8rem;
      background: #f0f5fc;
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      display: inline-block;
    }

    .subhead i {
      margin-right: 6px;
      color: #3a7bb0;
      opacity: 0.7;
    }

    /* form */
    .input-group {
      margin-bottom: 1.6rem;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #1d3a58;
      margin-bottom: 0.4rem;
    }

    .input-group .input-icon {
      position: absolute;
      left: 16px;
      top: 40px;
      color: #8aaec9;
      font-size: 1rem;
      transition: color 0.2s;
      pointer-events: none;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      background: #f2f7fe;
      border: 1px solid #d6e2f0;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 500;
      color: #0b1e33;
      outline: none;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
    }

    .input-group input:focus {
      border-color: #2f77b3;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(47, 119, 179, 0.12);
    }

    .input-group input:focus + .input-icon,
    .input-group input:focus ~ .input-icon {
      color: #1f5a88;
    }

    .input-group input::placeholder {
      color: #a3bdd6;
      font-weight: 400;
      font-size: 0.95rem;
    }

    .toggle-password {
      position: absolute;
      right: 18px;
      top: 40px;
      background: transparent;
      border: none;
      color: #8aaec9;
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0;
      line-height: 1;
    }

    .toggle-password:hover {
      color: #1f5a88;
    }

    .row-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.2rem 0 1.8rem 0;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #1d3a58;
      font-size: 0.9rem;
      font-weight: 450;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      background: #f2f7fe;
      border: 1px solid #b8cee4;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .remember-me input[type="checkbox"]:checked {
      background: #1f5a88;
      border-color: #1f5a88;
      box-shadow: 0 0 10px rgba(31, 90, 136, 0.2);
    }

    .remember-me input[type="checkbox"]:checked::after {
      content: "\f00c";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-size: 12px;
      color: white;
      display: block;
    }

    .forgot-link {
      color: #2f6d9e;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      border-bottom: 1px dotted #b8cee4;
    }

    .forgot-link:hover {
      color: #0f3e61;
      border-bottom-color: #1f5a88;
    }

    .login-btn {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #1a4a73, #0d2e4b);
      border: none;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px -8px rgba(10, 40, 70, 0.4);
      margin-top: 0.2rem;
    }

    .login-btn i {
      font-size: 1rem;
      transition: transform 0.25s;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #235f8f, #123a5a);
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -10px #0a2640;
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message-box {
      background: #fce9e9;
      border-left: 4px solid #d95b5b;
      padding: 0.65rem 1rem;
      border-radius: 30px;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #a13d3d;
      font-size: 0.9rem;
      font-weight: 450;
      transition: all 0.2s;
      min-height: 3rem;
    }

    .message-box i {
      color: #c94a4a;
      font-size: 1rem;
    }

    .message-box.hidden {
      opacity: 0;
      visibility: hidden;
      display: none;
    }

    .secure-note {
      margin-top: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      color: #6f8fa8;
      font-size: 0.7rem;
      letter-spacing: 0.3px;
      border-top: 1px solid #e6eef8;
      padding-top: 1.2rem;
    }

    .secure-note i {
      color: #4d7ca3;
    }

    .secure-note span {
      background: #f0f6fd;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
    }

    /* responsive */
    @media (max-width: 600px) {
      .header-dark {
        flex-direction: column;
        align-items: flex-start;
        border-radius: 40px 40px 20px 20px;
        padding: 1rem 1.5rem;
      }
      .header-badge {
        align-self: flex-start;
      }
      .footer-dark {
        border-radius: 20px 20px 40px 40px;
        padding: 0.8rem 1rem;
        text-align: center;
      }
      .login-card {
        padding: 2rem 1.5rem;
        border-radius: 32px;
      }
      .brand h1 {
        font-size: 1.4rem;
      }
      .row-actions {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .forgot-link {
        align-self: flex-end;
      }
      .header-main-title {
        font-size: 1rem;
      }
    }

    /* tiny extra */
    .icf-logo-img {
      /* if you want to use actual PNG, uncomment below and remove .logo-placeholder background */
      /* background: url('ICF logo.png') center/contain no-repeat; */
      width: 48px;
      height: 48px;
    }
  </style>
</head>
<body>

  <!-- ===== DARK BLUE HEADER ===== -->
  <header class="header-dark">
    <div class="header-left">
      <!-- ICF Logo (PNG placeholder) -->
      <div class="logo-placeholder" role="img" aria-label="ICF Logo"></div>
      <!-- if you have ICF logo.png, replace above with: <img src="ICF logo.png" alt="ICF Logo" style="height:48px; width:48px; object-fit:contain;"> -->
      <div class="header-title-group">
        <span class="header-main-title">INFORMATICS CONSULTANCY FIRM SIERRA LEONE</span>
        <span class="header-sub-title">
          <i class="fas fa-chart-pie"></i> Financial Records
        </span>
      </div>
    </div>
    <div class="header-badge">
      <i class="fas fa-lock" style="margin-right: 4px;"></i> Secure
    </div>
  </header>

  <!-- ===== LOGIN CARD (plain body) ===== -->
  <div class="login-card">
    <!-- inner brand (optional but kept minimal) -->
    <div class="brand">
      <i class="fas fa-coins"></i>
      <h1>ICF Access</h1>
    </div>
    <div class="subhead">
      <i class="fas fa-sign-in-alt"></i> Sign in to ICF financial records
    </div>

    <form id="loginForm" autocomplete="off" novalidate>
      <div id="messageBox" class="message-box hidden">
        <i class="fas fa-circle-exclamation"></i>
        <span id="messageText">Invalid credentials</span>
      </div>

      <div class="input-group">
        <label for="username"><i class="far fa-user" style="margin-right: 5px;"></i> Username</label>
        <input type="text" id="username" placeholder="Admin" value="Admin" required />
        <i class="fas fa-user input-icon"></i>
      </div>

      <div class="input-group">
        <label for="password"><i class="fas fa-key" style="margin-right: 5px;"></i> Password</label>
        <input type="password" id="password" placeholder="••••••••" value="admin123" required />
        <i class="fas fa-lock input-icon"></i>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
          <i class="fas fa-eye-slash" id="eyeIcon"></i>
        </button>
      </div>

      <div class="row-actions">
        <label class="remember-me">
          <input type="checkbox" id="rememberCheck" checked /> 
          <span>Keep me signed in</span>
        </label>
        <a href="#" class="forgot-link" onclick="alert('Reset link sent (demo)'); return false;">Forgot?</a>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span>Unlock records</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="secure-note">
      <i class="fas fa-database"></i>
      <span>🔒 256‑bit encrypted session</span>
    </div>
  </div>

  <!-- ===== DARK BLUE FOOTER ===== -->
  <footer class="footer-dark">
    <div class="footer-text">
      <i class="fas fa-building"></i>
      ICF-SL. Finance
      <span class="footer-divider"></span>
      <i class="fas fa-shield-alt" style="opacity:0.6;"></i>
      <span style="font-weight:300; opacity:0.7;">&copy; 2026</span>
    </div>
  </footer>

  <script>
    (function() {
      "use strict";

      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');
      const messageBox = document.getElementById('messageBox');
      const messageText = document.getElementById('messageText');
      const rememberCheck = document.getElementById('rememberCheck');
      const loginBtn = document.getElementById('loginBtn');

      const VALID_USER = 'Admin';
      const VALID_PASS = 'admin123';

      function showMessage(msg, isError = true) {
        messageBox.classList.remove('hidden');
        messageText.textContent = msg;
        if (isError) {
          messageBox.style.background = '#fce9e9';
          messageBox.style.borderLeftColor = '#d95b5b';
          messageBox.style.color = '#a13d3d';
        } else {
          messageBox.style.background = '#e3f3e9';
          messageBox.style.borderLeftColor = '#3a9b6a';
          messageBox.style.color = '#1f6a44';
        }
      }

      function hideMessage() {
        messageBox.classList.add('hidden');
      }

      // toggle password
      toggleBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (type === 'text') {
          eyeIcon.classList.remove('fa-eye-slash');
          eyeIcon.classList.add('fa-eye');
        } else {
          eyeIcon.classList.remove('fa-eye');
          eyeIcon.classList.add('fa-eye-slash');
        }
      });

      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessage();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (username === '' || password === '') {
          showMessage('Please fill in both fields.', true);
          return;
        }

        if (username === VALID_USER && password === VALID_PASS) {
          if (rememberCheck.checked) {
            localStorage.setItem('icf_remember', 'true');
          } else {
            localStorage.removeItem('icf_remember');
          }

          showMessage('✅ Access granted. Redirecting to ICF dashboard…', false);
          loginBtn.disabled = true;
          loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Loading…';

          setTimeout(function() {
            window.location.href = 'login.html';
          }, 900);
        } else {
          showMessage('❌ Invalid credentials. Use Admin / admin123', true);
          loginForm.style.animation = 'shake 0.3s ease';
          setTimeout(() => { loginForm.style.animation = ''; }, 350);
          passwordInput.value = '';
          passwordInput.focus();
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Unlock records</span> <i class="fas fa-arrow-right"></i>';
        }
      });

      // inject shake
      if (!document.getElementById('shakeStyle')) {
        const style = document.createElement('style');
        style.id = 'shakeStyle';
        style.textContent = `
          @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
          }
        `;
        document.head.appendChild(style);
      }

      if (localStorage.getItem('icf_remember') === 'true') {
        rememberCheck.checked = true;
      }

      usernameInput.addEventListener('input', hideMessage);
      passwordInput.addEventListener('input', hideMessage);

      window.addEventListener('load', function() {
        usernameInput.focus();
        if (usernameInput.value === 'Admin') {
          usernameInput.setSelectionRange(0, usernameInput.value.length);
        }
      });
    })();
  </script>
</body>
</html>
